<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>437 Studio | Cyber Forum</title>
    <link rel="icon" type="image/png" href="/img/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/maintenance.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1000;
            padding: 15px 30px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 15px;
            margin: 0;
            padding: 0;
            flex-wrap: nowrap;
        }

        .auth-container {
            display: flex;
            align-items: center;
            position: relative;
            margin-left: 10px;
        }

        .user-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 5px 12px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid #00f0ff;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .user-trigger:hover {
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .user-trigger img {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #080814;
            border: 1px solid #00f0ff;
            border-radius: 6px;
            min-width: 170px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 240, 255, 0.2);
            z-index: 99999 !important;
        }

        .dropdown-menu.hidden {
            display: none !important;
        }

        /* CUSTOM CYBER MODAL / DESIGN-FENSTER (ERSETZT BROWSER ALERT / CONFIRM) */
        .cyber-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 3, 10, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            backdrop-filter: blur(8px);
            animation: fadeInModal 0.25s ease;
        }
        .cyber-modal-overlay.hidden {
            display: none !important;
        }
        @keyframes fadeInModal {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .cyber-modal-box {
            background: linear-gradient(135deg, #0c0c18 0%, #160a2a 100%);
            border: 2px solid #00f0ff;
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.35), inset 0 0 15px rgba(0, 240, 255, 0.1);
            font-family: monospace;
            position: relative;
        }
        .cyber-modal-box.danger {
            border-color: #ff007f;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.35), inset 0 0 15px rgba(255, 0, 127, 0.1);
        }
        .cyber-modal-box.success {
            border-color: #00ff66;
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.35), inset 0 0 15px rgba(0, 255, 102, 0.1);
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>

    <!-- CUSTOM DESIGN CYBER MODAL -->
    <div id="cyber-custom-modal" class="cyber-modal-overlay hidden">
        <div id="cyber-modal-box-inner" class="cyber-modal-box">
            <div id="cyber-modal-icon" style="font-size: 42px; color: #00f0ff; margin-bottom: 12px; text-shadow: 0 0 15px rgba(0,240,255,0.6);">
                <i class="fas fa-satellite-dish"></i>
            </div>
            <h2 id="cyber-modal-title" style="color: #00f0ff; font-size: 16px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">System Meldung</h2>
            <p id="cyber-modal-text" style="color: #ccc; font-size: 12px; line-height: 1.5; margin-bottom: 20px;">
                Nachrichtentext...
            </p>
            <div id="cyber-modal-actions" style="display: flex; gap: 10px;">
                <!-- Dynamische Buttons -->
            </div>
        </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">437<span>Studio</span></div>
        <div class="menu-toggle"><i class="fas fa-bars"></i></div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="forum.html" class="active"><i class="fas fa-comments"></i> Forum</a></li>
            <li><a href="games.html"><i class="fas fa-gamepad"></i> Games</a></li>
            <li><a href="mitglieder.html"><i class="fas fa-users"></i> Mitglieder</a></li>  
            <li><a href="music.html"><i class="fas fa-music"></i> Musik</a></li>
            <li><a href="discord.html"><i class="fab fa-discord"></i> Discord</a></li>
            <li class="auth-container">
                <div id="logged-out-zone">
                    <button class="btn btn-neon-blue" onclick="redirectToLogin()">Login / Register</button>
                </div>
                <div id="logged-in-zone" class="hidden user-trigger" onclick="toggleProfileDropdown()">
                    <img id="nav-avatar" src="" alt="Avatar">
                    <span id="nav-username">User</span> 
                    <span id="admin-badge" class="hidden" style="color:#ff007f; font-size:10px; border:1px solid #ff007f; padding:2px 4px; border-radius:4px; margin-left:5px;">ADMIN</span>
                    <span id="dropdown-msg-badge" class="hidden"></span>
                    <div id="profile-dropdown" class="dropdown-menu hidden"></div>
                </div>
            </li>
        </ul>
    </nav>

    <!-- Forum Hauptbereich -->
    <main style="max-width: 900px; margin: 100px auto 40px auto; padding: 0 20px; font-family: monospace;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #1a1a3a; padding-bottom: 20px;">
            <div>
                <h1 class="neon-text-blue" style="font-size: 24px; margin-bottom: 5px;"><i class="fas fa-comments"></i> Net-Forum Matrix</h1>
                <p style="color: #888; font-size: 13px;">Diskutiere über Updates, Weed und Projekte von Nalix437 & Amnesia437.</p>
            </div>
            <button onclick="openCreateDiscussionModal()" class="btn btn-neon-green" style="font-size: 13px; padding: 10px 20px; white-space: nowrap;">
                <i class="fas fa-plus"></i> Diskussion starten
            </button>
        </div>

        <!-- Dynamischer Container für Foren-Beiträge -->
        <div id="forum-threads-container">
            <!-- Wird von forum.js geladen -->
        </div>
    </main>

    <!-- Globale Skripte -->
    <script src="js/app.js"></script>
    <script src="js/forum.js"></script>
    <script>
        // --- GLOBALE DESIGN-MODALS FÜR DAS FORUM (ÜBERSCHREIBT STANDARD ALERT/CONFIRM) ---
        window.showCyberAlert = function(title, text, type = "info") {
            const modal = document.getElementById("cyber-custom-modal");
            const boxInner = document.getElementById("cyber-modal-box-inner");
            const iconEl = document.getElementById("cyber-modal-icon");
            const titleEl = document.getElementById("cyber-modal-title");
            const textEl = document.getElementById("cyber-modal-text");
            const actionsEl = document.getElementById("cyber-modal-actions");

            if (!modal) {
                alert(text);
                return;
            }

            boxInner.className = `cyber-modal-box ${type}`;
            titleEl.textContent = title;
            textEl.textContent = text;

            if (type === "danger") {
                iconEl.className = "fas fa-exclamation-triangle";
                iconEl.style.color = "#ff007f";
                iconEl.style.textShadow = "0 0 15px rgba(255,0,127,0.6)";
                titleEl.style.color = "#ff007f";
            } else if (type === "success") {
                iconEl.className = "fas fa-check-circle";
                iconEl.style.color = "#00ff66";
                iconEl.style.textShadow = "0 0 15px rgba(0,255,102,0.6)";
                titleEl.style.color = "#00ff66";
            } else {
                iconEl.className = "fas fa-satellite-dish";
                iconEl.style.color = "#00f0ff";
                iconEl.style.textShadow = "0 0 15px rgba(0,240,255,0.6)";
                titleEl.style.color = "#00f0ff";
            }

            actionsEl.innerHTML = `
                <button onclick="closeCyberModal()" class="btn btn-neon-blue" style="width: 100%; padding: 10px; font-size: 12px; cursor: pointer; font-weight: bold;">
                    <i class="fas fa-check"></i> Bestätigen
                </button>
            `;

            modal.classList.remove("hidden");
        };

        window.showCyberConfirm = function(title, text, onConfirmCallback) {
            const modal = document.getElementById("cyber-custom-modal");
            const boxInner = document.getElementById("cyber-modal-box-inner");
            const iconEl = document.getElementById("cyber-modal-icon");
            const titleEl = document.getElementById("cyber-modal-title");
            const textEl = document.getElementById("cyber-modal-text");
            const actionsEl = document.getElementById("cyber-modal-actions");

            if (!modal) {
                if (confirm(text)) {
                    if (typeof onConfirmCallback === "function") onConfirmCallback();
                }
                return;
            }

            boxInner.className = "cyber-modal-box danger";
            iconEl.className = "fas fa-shield-alt";
            iconEl.style.color = "#ff007f";
            iconEl.style.textShadow = "0 0 15px rgba(255,0,127,0.6)";
            titleEl.textContent = title;
            titleEl.style.color = "#ff007f";
            textEl.textContent = text;

            actionsEl.innerHTML = `
                <button onclick="closeCyberModal()" class="btn" style="flex: 1; padding: 10px; font-size: 11px; background: rgba(255,255,255,0.05); border: 1px solid #555; color: #aaa; cursor: pointer;">
                    Abbrechen
                </button>
                <button id="cyber-confirm-yes-btn" class="btn" style="flex: 1; padding: 10px; font-size: 11px; background: rgba(255,0,127,0.2); border: 1px solid #ff007f; color: #ff007f; cursor: pointer; font-weight: bold;">
                    Ausführen
                </button>
            `;

            modal.classList.remove("hidden");

            document.getElementById("cyber-confirm-yes-btn").onclick = () => {
                closeCyberModal();
                if (typeof onConfirmCallback === "function") {
                    onConfirmCallback();
                }
            };
        };

        function closeCyberModal() {
            const modal = document.getElementById("cyber-custom-modal");
            if (modal) modal.classList.add("hidden");
        }
    </script>
</body>
</html>
